name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  select-builder:
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.select.outputs.cloud }}
    steps:
      - id: select
        name: Check who builds this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          cloud=true
          if [[ $(jq -r .object.type <<< "$ref") == tag ]]; then
            sha=$(jq -r .object.sha <<< "$ref")
            subject=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message | split("\n")[0]')
            if [[ $subject == 'Publish from local Mac' ]]; then cloud=false; fi
          fi
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

  release:
    needs: select-builder
    if: needs.select-builder.outputs.cloud == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: publish-connection-browser
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Load the app signing identity for this job
        env:
          TABLEEXPLORER_SIGNING_P12: ${{ secrets.TABLEEXPLORER_SIGNING_P12 }}
          TABLEEXPLORER_SIGNING_PASSWORD: ${{ secrets.TABLEEXPLORER_SIGNING_PASSWORD }}
        run: Scripts/ci-signing-keychain.sh

      - name: Check version and install build dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Scripts/release.sh check-version "$RELEASE_TAG"
          brew install mariadb-connector-c

      - name: Test SQLite and package the standalone app
        run: |
          Scripts/check-sqlite.sh
          Scripts/package-release.sh "$RELEASE_TAG"

      - name: Sign and verify the release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Scripts/sign-release.sh "$RELEASE_TAG"

      - name: Publish and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/release.sh publish-ci "$RELEASE_TAG"

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/table-explorer-signing.keychain-db"
          if [[ -e "$keychain" ]]; then security delete-keychain "$keychain"; fi
